# BiSeNetV2 Training Configuration for Kaggle Notebooks (Tesla T4 GPU x2, 16GB VRAM)
model:
  name: bisenetv2
  num_classes: 4
  input_height: 512
  input_width: 1024
  auxiliary_loss: true
  aux_weights: [1.0, 1.0, 1.0, 1.0]

dataset:
  train:
    - name: cityscapes
      root: data/cityscapes
      split: train
  val:
    - name: cityscapes
      root: data/cityscapes
      split: val
  num_workers: 4

training:
  batch_size: 8         # Optimal for Kaggle Tesla T4 (16GB VRAM)
  epochs: 100
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.01
  lr_schedule: poly
  poly_power: 0.9
  warmup_epochs: 5
  class_weights: auto
  loss: ohem_ce_dice
  ohem_threshold: 0.7
  dice_weight: 0.5
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001

augmentation:
  random_crop: [512, 1024]
  horizontal_flip: 0.5
  color_jitter: [0.3, 0.3, 0.3, 0.1]
  gaussian_blur: 0.1
  brightness_contrast: [0.3, 0.3]
  random_shadow: 0.3
  copy_paste: 0.2

logging:
  save_dir: /kaggle/working/checkpoints
  save_every: 5
  log_images_every: 5

reproducibility:
  seed: 42
  deterministic: true
