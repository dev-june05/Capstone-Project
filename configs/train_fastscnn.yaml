# Fast-SCNN Training Configuration
model:
  name: fastscnn
  num_classes: 4
  input_height: 512
  input_width: 1024
  auxiliary_loss: false
  aux_weights: [1.0, 1.0, 1.0, 1.0]

dataset:
  train:
    - name: cityscapes
      root: data/cityscapes
      split: train
    - name: idd
      root: data/idd
      split: train
  val:
    - name: cityscapes
      root: data/cityscapes
      split: val
  num_workers: 2

training:
  batch_size: 2  # Set to 2 for 4GB VRAM (RTX 3050 Laptop).
  epochs: 120
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.01
  lr_schedule: poly
  poly_power: 0.9
  warmup_epochs: 5
  class_weights: auto
  loss: ohem_ce_dice
  ohem_threshold: 0.7
  dice_weight: 0.5
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001

augmentation:
  random_crop: [512, 1024]
  horizontal_flip: 0.5
  color_jitter: [0.3, 0.3, 0.3, 0.1]
  gaussian_blur: 0.1
  brightness_contrast: [0.3, 0.3]
  random_shadow: 0.3
  copy_paste: 0.2

finetuning:
  enabled: false
  campus_root: data/campus
  epochs: 80
  learning_rate: 0.0001
  freeze_early_layers: true

logging:
  wandb_project: capstone-walkability
  save_dir: checkpoints
  save_every: 10
  log_images_every: 5

reproducibility:
  seed: 42
  deterministic: true
